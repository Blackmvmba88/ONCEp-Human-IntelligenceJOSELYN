[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "joselyn-cli"
version = "0.1.0"
description = "JOSELYN CLI and PONCE Human Intelligence Runtime bootstrap"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Iyari Gomez" },
  { name = "Chatsy" }
]
dependencies = []

[project.scripts]
joselyn = "joselyn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
